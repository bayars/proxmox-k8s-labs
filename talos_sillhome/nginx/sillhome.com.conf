upstream sillhome {
    server 10.10.10.60:80 fail_timeout=0;
}

# Only once in the http context.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name sillhome.com;

    access_log /var/log/nginx/sillhome_access.log;
    error_log  /var/log/nginx/sillhome_error.log;

    server_tokens off;

    # HAProxy cannot add it: the Cilium Gateway rewrites X-Forwarded-Proto to http.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Origin lock: only Cloudflare and the LAN. Needs nginx/cloudflare-allow.conf (defines $from_cloudflare, http level) and
    # must stay in sync with cloudflare-realip.conf. The port 80 block below is NOT locked, so certbot HTTP-01 keeps working.
    # Test: curl -sk --resolve sillhome.com:443:<home-ip> https://sillhome.com/readyz   -> 403 (from outside the LAN)
    #       curl -sI https://sillhome.com/readyz                                       -> 200, server: cloudflare
    if ($from_cloudflare = 0) { return 403; }

    # No "return" in this block (a stray "return 301" caused an HTTPS redirect loop).
    location / {
        proxy_pass http://sillhome;
        proxy_redirect off;
        proxy_http_version 1.1;

        proxy_set_header Host sillhome.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        client_max_body_size 60m;
        client_body_buffer_size 128k;

        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
        proxy_buffering off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sillhome.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sillhome.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name sillhome.com;
    return 301 https://$host$request_uri;
}
