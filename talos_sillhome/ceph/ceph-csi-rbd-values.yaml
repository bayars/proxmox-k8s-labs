# Ceph on the Proxmox host (single node, pool size 1). Credentials live ONLY in the
# k8s Secret csi-rbd-secret (never in git): kubectl -n ceph-csi create secret generic csi-rbd-secret ...
csiConfig:
  - clusterID: 80c5113c-86f8-4642-a1db-b2422fc6e5d7
    monitors:
      - 10.0.0.79:6789
provisioner:
  replicaCount: 1
  # Keep the controller off the starved 2-vCPU control plane (the cp1 taint already blocks new pods; this survives a taint change).
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
  # Requests only (no limits: a tight limit kills the sidecars and the CSI socket drops). Go sidecars idle at ~10-20Mi.
  # Leader election defaults are 15s/10s/5s; under CPU starvation the lease renew misses and the sidecar exits. 60s/45s/10s tolerates it.
  provisioner:
    resources: {requests: {cpu: 10m, memory: 24Mi}}
    # the chart prepends "--" to each entry: write them without dashes
    extraArgs: ["leader-election-lease-duration=60s","leader-election-renew-deadline=45s","leader-election-retry-period=10s"]
  attacher:
    resources: {requests: {cpu: 10m, memory: 24Mi}}
    # the chart prepends "--" to each entry: write them without dashes
    extraArgs: ["leader-election-lease-duration=60s","leader-election-renew-deadline=45s","leader-election-retry-period=10s"]
  resizer:
    resources: {requests: {cpu: 10m, memory: 24Mi}}
    # the chart prepends "--" to each entry: write them without dashes
    extraArgs: ["leader-election-lease-duration=60s","leader-election-renew-deadline=45s","leader-election-retry-period=10s"]
  snapshotter:
    resources: {requests: {cpu: 10m, memory: 24Mi}}
    # the chart prepends "--" to each entry: write them without dashes
    extraArgs: ["leader-election-lease-duration=60s","leader-election-renew-deadline=45s","leader-election-retry-period=10s"]
storageClass:
  create: true
  name: ceph-rbd
  clusterID: 80c5113c-86f8-4642-a1db-b2422fc6e5d7
  pool: kubernetes
  imageFeatures: layering
  reclaimPolicy: Delete
  allowVolumeExpansion: true
  fstype: ext4
  mountOptions: []
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
secret:
  create: false
  name: csi-rbd-secret
cephconf: |
  [global]
    auth_cluster_required = cephx
    auth_service_required = cephx
    auth_client_required = cephx
    mon_host = 10.0.0.79:6789
# Nodeplugin / shared plugin requests live in ceph-csi-rbd-values.step2-nodeplugin.yaml (apply separately, see PROXMOX.md).
